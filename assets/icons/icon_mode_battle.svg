<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sword 1 (top-left to bottom-right) -->
  <g transform="rotate(45 32 32)">
    <!-- Blade -->
    <path d="M 30 8 L 32 4 L 34 8 L 34 40 L 30 40 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
    <line x1="32" y1="6" x2="32" y2="40" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Guard -->
    <rect x="23" y="40" width="18" height="4.5" rx="2" fill="#EF4444"/>
    <!-- Hilt -->
    <rect x="30" y="44.5" width="4" height="11" fill="#7F1D1D"/>
    <!-- Pommel -->
    <circle cx="32" cy="57" r="3" fill="#EF4444"/>
  </g>
  <!-- Sword 2 (top-right to bottom-left) -->
  <g transform="rotate(-45 32 32)">
    <!-- Blade -->
    <path d="M 30 8 L 32 4 L 34 8 L 34 40 L 30 40 Z" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
    <line x1="32" y1="6" x2="32" y2="40" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Guard -->
    <rect x="23" y="40" width="18" height="4.5" rx="2" fill="#DC2626"/>
    <!-- Hilt -->
    <rect x="30" y="44.5" width="4" height="11" fill="#991B1B"/>
    <!-- Pommel -->
    <circle cx="32" cy="57" r="3" fill="#DC2626"/>
  </g>
</svg>
