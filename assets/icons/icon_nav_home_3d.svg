<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="hShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Chimney -->
  <rect x="38" y="14" width="6" height="12" rx="2" fill="#0284C7"/>
  <!-- Walls -->
  <path d="M 16 28 L 16 50 C 16 53, 19 55, 22 55 L 42 55 C 45 55, 48 53, 48 50 L 48 28 Z" fill="url(#wallGrad)" filter="url(#hShad)"/>
  <!-- Door -->
  <path d="M 27 55 L 27 38 C 27 35, 37 35, 37 38 L 37 55 Z" fill="#1E40AF"/>
  <!-- Roof -->
  <path d="M 10 30 L 32 10 L 54 30 C 55 31, 53 33, 51 33 L 13 33 C 11 33, 9 31, 10 30 Z" fill="url(#roofGrad)" filter="url(#hShad)"/>
  <!-- Roof highlight ridge -->
  <path d="M 14 30 L 32 13 L 50 30" stroke="#BAE6FD" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
