<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgL30" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="digitGrad30" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="badgeShadow30" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgL30)" stroke="#93C5FD" stroke-width="2.5" filter="url(#badgeShadow30)"/>
  
  <!-- 3D Digit 30 -->
  <text x="50" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#digitGrad30)" text-anchor="middle">30</text>
  
  <!-- Mini Calendar (bottom-left) -->
  <rect x="18" y="66" width="18" height="16" rx="3" fill="#3B82F6"/>
  <rect x="18" y="66" width="18" height="5" rx="2" fill="#1D4ED8"/>
  <rect x="22" y="74" width="3" height="3" fill="#FFF"/>
  <rect x="28" y="74" width="3" height="3" fill="#FFF"/>
  
  <!-- Mini Gamepad (bottom-right) -->
  <rect x="64" y="68" width="20" height="12" rx="4" fill="#F59E0B"/>
  <circle cx="69" cy="74" r="1.8" fill="#FFF"/>
  <circle cx="79" cy="74" r="1.8" fill="#FFF"/>
  
  <!-- Top Stars -->
  <polygon points="32,22 34,26 39,26 35,29 36,34 32,31 28,34 29,29 25,26 30,26" fill="#FBBF24"/>
  <polygon points="46,18 48,21 52,21 49,23 50,27 46,25 42,27 43,23 40,21 44,21" fill="#F59E0B"/>
</svg>
