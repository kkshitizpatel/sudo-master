<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgL15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="digitGrad15" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="badgeShadow15" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#C2410C" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgL15)" stroke="#FDBA74" stroke-width="2.5" filter="url(#badgeShadow15)"/>
  
  <!-- 3D Digit 15 -->
  <text x="50" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#digitGrad15)" text-anchor="middle">15</text>
  
  <!-- Mini Gamepad (bottom-left) -->
  <rect x="18" y="66" width="22" height="13" rx="4" fill="#F97316"/>
  <circle cx="23" cy="72" r="2" fill="#FFF"/>
  <circle cx="34" cy="72" r="2" fill="#FFF"/>
  
  <!-- Mini Pencil (bottom-right) -->
  <g transform="rotate(-40 76 72)">
    <rect x="72" y="62" width="7" height="18" rx="2" fill="#FBBF24"/>
    <polygon points="72,80 79,80 75.5,86" fill="#FED7AA"/>
    <rect x="72" y="60" width="7" height="3" fill="#F472B6"/>
  </g>
  
  <!-- Top Stars -->
  <polygon points="34,20 36,24 41,24 37,27 38,32 34,29 30,32 31,27 27,24 32,24" fill="#FBBF24"/>
  <polygon points="46,16 48,19 52,19 49,21 50,25 46,23 42,25 43,21 40,19 44,19" fill="#F59E0B"/>
</svg>
