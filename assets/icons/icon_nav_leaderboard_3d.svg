<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldTrophy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="pedestal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="trShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#78350F" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Handles -->
  <path d="M 18 18 C 10 18, 10 32, 21 32" fill="none" stroke="#EAB308" stroke-width="4" stroke-linecap="round"/>
  <path d="M 46 18 C 54 18, 54 32, 43 32" fill="none" stroke="#EAB308" stroke-width="4" stroke-linecap="round"/>
  <!-- Cup body -->
  <path d="M 17 12 L 47 12 L 43 32 C 41 40, 36 44, 32 44 C 28 44, 23 40, 21 32 Z" fill="url(#goldTrophy)" filter="url(#trShad)"/>
  <!-- Cup Stem -->
  <rect x="29" y="43" width="6" height="9" rx="2" fill="#CA8A04"/>
  <!-- Pedestal -->
  <rect x="18" y="52" width="28" height="6" rx="3" fill="url(#pedestal)" filter="url(#trShad)"/>
  <!-- Star on Cup -->
  <path d="M 32 21 L 33.5 25.5 L 38 25.5 L 34.5 28 L 36 32.5 L 32 30 L 28 32.5 L 29.5 28 L 26 25.5 L 30.5 25.5 Z" fill="#FEF08A"/>
</svg>
