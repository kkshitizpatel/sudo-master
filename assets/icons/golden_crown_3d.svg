<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="crownShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Crown spikes with smooth curves -->
  <path d="M 14 56 C 14 56 16 28 20 28 C 24 28 34 42 38 42 C 42 42 40 18 44 18 C 48 18 54 42 58 42 C 62 42 66 28 70 28 C 74 28 72 56 72 56 Z" 
        fill="url(#crownGrad)" filter="url(#crownShadow)"/>
  <!-- Crown base band -->
  <path d="M 12 54 Q 44 64 74 54 L 72 62 Q 44 72 14 62 Z" fill="#D97706"/>
  <path d="M 13 53 Q 44 63 73 53 L 71 59 Q 44 69 15 59 Z" fill="#FBBF24"/>
  <!-- Jewels / pearls on peaks -->
  <circle cx="20" cy="27" r="4.5" fill="#FFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="44" cy="17" r="5.5" fill="#FFF" stroke="#FDE68A" stroke-width="1.5"/>
  <circle cx="70" cy="27" r="4.5" fill="#FFF" stroke="#FDE68A" stroke-width="1.5"/>
</svg>
