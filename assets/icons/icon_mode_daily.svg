<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="calShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#D97706" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Calendar Body -->
  <rect x="8" y="14" width="48" height="42" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2.5" filter="url(#calShadow)"/>
  <rect x="8" y="14" width="48" height="12" rx="6" fill="#F59E0B"/>
  
  <!-- Rings -->
  <rect x="18" y="8" width="5" height="10" rx="2.5" fill="#CBD5E1"/>
  <rect x="41" y="8" width="5" height="10" rx="2.5" fill="#CBD5E1"/>
  
  <!-- Grid Dots / Cells -->
  <circle cx="20" cy="34" r="3" fill="#FED7AA"/>
  <circle cx="32" cy="34" r="3" fill="#FED7AA"/>
  <circle cx="44" cy="34" r="3" fill="#FED7AA"/>
  <circle cx="20" cy="44" r="3" fill="#FED7AA"/>
  <circle cx="32" cy="44" r="3" fill="#FED7AA"/>
  
  <!-- Golden Star on bottom-right -->
  <polygon points="46,38 48.5,43 54,43.5 50,47 51,52.5 46,49.5 41,52.5 42,47 38,43.5 43.5,43" 
           fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
</svg>
