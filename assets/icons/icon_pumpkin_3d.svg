<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="pumpGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFA439"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="stemGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </radialGradient>
    <filter id="pShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#7C2D12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Stem -->
  <path d="M 30 18 C 30 10, 36 8, 38 7 C 37 11, 35 14, 34 18 Z" fill="url(#stemGrad)"/>
  <!-- Pumpkin side lobes -->
  <ellipse cx="20" cy="38" rx="14" ry="17" fill="url(#pumpGrad)" filter="url(#pShad)"/>
  <ellipse cx="44" cy="38" rx="14" ry="17" fill="url(#pumpGrad)" filter="url(#pShad)"/>
  <!-- Pumpkin center lobe -->
  <ellipse cx="32" cy="38" rx="13" ry="18" fill="url(#pumpGrad)" filter="url(#pShad)"/>
  <!-- Specular highlights -->
  <ellipse cx="24" cy="28" rx="4" ry="7" fill="#FFFFFF" opacity="0.35" transform="rotate(-15 24 28)"/>
  <!-- Smiling Face / Pumpkin Carving -->
  <polygon points="23,34 27,37 23,38" fill="#7C2D12"/>
  <polygon points="41,34 37,37 41,38" fill="#7C2D12"/>
  <path d="M 24 43 Q 32 50 40 43 Q 32 46 24 43 Z" fill="#7C2D12"/>
</svg>
