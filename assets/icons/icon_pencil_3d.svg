<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="pencilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g transform="rotate(-35 50 50)" filter="url(#pencilShadow)">
    <!-- Eraser (Pink) -->
    <path d="M 40 12 C 40 7 60 7 60 12 L 60 22 L 40 22 Z" fill="#F472B6"/>
    <!-- Metal Ferrule (Silver) -->
    <rect x="38" y="22" width="24" height="8" rx="2" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1"/>
    <!-- Pencil Body (Vibrant Yellow / Orange Gold) -->
    <path d="M 40 30 L 60 30 L 60 74 L 40 74 Z" fill="#FBBF24"/>
    <path d="M 40 30 L 50 30 L 50 74 L 40 74 Z" fill="#F59E0B"/>
    <!-- Sharpened Wood (Warm Cream) -->
    <polygon points="40,74 60,74 50,92" fill="#FED7AA"/>
    <!-- Graphite Lead Tip (Deep Slate) -->
    <polygon points="47,87 53,87 50,94" fill="#334155"/>
  </g>
</svg>
