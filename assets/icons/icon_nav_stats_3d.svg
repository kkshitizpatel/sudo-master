<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="barShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#1E293B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Bar 1 (Left - Blue/Cyan) -->
  <rect x="14" y="32" width="10" height="24" rx="4" fill="url(#blueBar)" filter="url(#barShad)"/>
  <!-- Bar 2 (Middle - Orange) -->
  <rect x="27" y="14" width="10" height="42" rx="4" fill="url(#orangeBar)" filter="url(#barShad)"/>
  <!-- Bar 3 (Right - Cyan/Teal) -->
  <rect x="40" y="24" width="10" height="32" rx="4" fill="url(#cyanBar)" filter="url(#barShad)"/>
</svg>
