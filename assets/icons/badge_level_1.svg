<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgL1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="digitGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#166534" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgL1)" stroke="#86EFAC" stroke-width="2.5" filter="url(#badgeShadow)"/>
  
  <!-- Green Sprout Leaves -->
  <path d="M 46 36 C 42 22 28 22 28 28 C 28 36 44 38 46 36 Z" fill="#22C55E"/>
  <path d="M 50 36 C 54 22 68 22 68 28 C 68 36 52 38 50 36 Z" fill="#16A34A"/>
  <path d="M 48 34 Q 48 44 48 48" stroke="#15803D" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 3D Digit 1 -->
  <text x="46" y="80" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="url(#digitGrad1)" text-anchor="middle">1</text>
  
  <!-- Golden Star Accent -->
  <polygon points="68,52 70,57 76,57 71,60 73,66 68,62 63,66 65,60 60,57 66,57" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
</svg>
